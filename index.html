<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LEWO MEN'S WEAR — Wear Your Voice</title>

  <meta name="description"
        content="LEWO MEN'S WEAR — Premium contemporary T-shirts. Wear Your Voice.">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: #050505;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* NAVBAR */
    nav {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      z-index: 1000;
      padding: 22px 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      mix-blend-mode: difference;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
      letter-spacing: 5px;
    }

    nav a {
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-left: 28px;
    }

    /* HERO */
    .hero {
      min-height: 100vh;
      display: flex;
      align-items: flex-end;
      padding: 120px 5% 70px;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 75% 35%, #222 0%, transparent 35%),
        #050505;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      max-width: 850px;
    }

    .eyebrow {
      font-size: 11px;
      letter-spacing: 5px;
      text-transform: uppercase;
      color: #aaa;
      margin-bottom: 22px;
    }

    .hero h1 {
      font-size: clamp(70px, 14vw, 190px);
      line-height: .78;
      letter-spacing: -8px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .hero-sub {
      margin-top: 35px;
      font-size: clamp(18px, 2vw, 27px);
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .hero-button {
      display: inline-block;
      margin-top: 45px;
      padding: 17px 28px;
      border: 1px solid #777;
      border-radius: 50px;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: .3s;
    }

    .hero-button:hover {
      background: #fff;
      color: #000;
      border-color: #fff;
    }

    /* MARQUEE */
    .marquee {
      border-top: 1px solid #222;
      border-bottom: 1px solid #222;
      padding: 22px 0;
      overflow: hidden;
      white-space: nowrap;
    }

    .marquee-track {
      display: inline-block;
      animation: move 18s linear infinite;
      font-size: 12px;
      letter-spacing: 5px;
      color: #aaa;
    }

    @keyframes move {
      from { transform: translateX(0); }
      to { transform: translateX(-50%); }
    }

    /* SECTIONS */
    section {
      padding: 120px 5%;
    }

    .section-label {
      font-size: 11px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #777;
      margin-bottom: 50px;
    }

    .section-title {
      font-size: clamp(45px, 8vw, 110px);
      line-height: .9;
      letter-spacing: -4px;
      text-transform: uppercase;
    }

    /* COLLECTION */
    .collection {
      background: #f2f2f0;
      color: #080808;
    }

    .collection .section-label {
      color: #777;
    }

    .products {
      margin-top: 70px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .product {
      position: relative;
      background: #ddd;
      overflow: hidden;
      aspect-ratio: 4 / 5;
    }

    .product img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: transform .7s ease;
    }

    .product:hover img {
      transform: scale(1.04);
    }

    .product-info {
      position: absolute;
      left: 25px;
      bottom: 22px;
      right: 25px;
      display: flex;
      justify-content: space-between;
      align-items: end;
      color: white;
      text-shadow: 0 2px 15px #000;
    }

    .product-number {
      font-size: 11px;
      letter-spacing: 3px;
    }

    .product-name {
      font-size: 18px;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-top: 7px;
    }

    /* STORY */
    .story {
      background: #050505;
    }

    .story-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 80px;
      align-items: center;
    }

    .story-text {
      font-size: clamp(25px, 3vw, 45px);
      line-height: 1.1;
      letter-spacing: -1px;
    }

    .story-small {
      color: #999;
      line-height: 1.8;
      font-size: 15px;
      margin-top: 35px;
      max-width: 520px;
    }

    .story-box {
      aspect-ratio: 1;
      background:
        linear-gradient(135deg, #333, #111 60%, #000);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: clamp(50px, 10vw, 130px);
      font-weight: 900;
      letter-spacing: -8px;
    }

    /* MANIFESTO */
    .manifesto {
      min-height: 70vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      border-top: 1px solid #222;
      border-bottom: 1px solid #222;
    }

    .manifesto h2 {
      font-size: clamp(50px, 9vw, 140px);
      line-height: .85;
      letter-spacing: -6px;
      text-transform: uppercase;
    }

    /* CONTACT */
    .contact {
      background: #fff;
      color: #050505;
    }

    .contact .section-label {
      color: #777;
    }

    .contact h2 {
      font-size: clamp(50px, 9vw, 130px);
      line-height: .85;
      letter-spacing: -6px;
      text-transform: uppercase;
    }

    .contact-links {
      margin-top: 60px;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
    }

    .contact-button {
      display: inline-block;
      padding: 17px 25px;
      border: 1px solid #111;
      border-radius: 50px;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: .3s;
    }

    .contact-button:hover {
      background: #000;
      color: #fff;
    }

    /* FOOTER */
    footer {
      padding: 35px 5%;
      background: #050505;
      color: #777;
      display: flex;
      justify-content: space-between;
      gap: 20px;
      font
